services:
  - type: web
    name: trustgraph-backend
    env: python
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trustgraph-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://trustgraph-ai.vercel.app

databases:
  - name: trustgraph-db
    region: oregon
    databaseName: trustgraph
    user: postgres
